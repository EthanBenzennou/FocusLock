<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site blocked · FocusLock</title>
    <link rel="stylesheet" href="focuslock.css" />
  </head>
  <body>
    <main class="page">
      <div class="brand"><span class="brand-mark" aria-hidden="true">FL</span> FocusLock</div>
      <section class="card" aria-labelledby="blocked-title">
        <div class="status-pill"><span class="status-dot" aria-hidden="true"></span> Focus mode</div>
        <h1 id="blocked-title">This page is blocked</h1>
        <p id="message" class="intro">This site isn’t allowed.</p>
        <div id="domain-name" class="blocked-target">Loading…</div>
        <div class="actions">
          <button id="allow-domain-btn">Allow site</button>
          <button id="allow-page-btn" class="allow-page" style="display: none">
            Allow page
          </button>
          <div class="separator-label" aria-hidden="true">or</div>
          <button id="safesearch-btn" class="safe-search">
            Start Safe Search
          </button>
        </div>
      </section>
    </main>
    <script src="whitelist-utils.js"></script>
    <script src="secure-storage.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
