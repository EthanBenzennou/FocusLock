<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Safe Search Duration</title>
    <link rel="stylesheet" href="focuslock.css" />
  </head>
  <body>
    <main class="page">
      <div class="brand"><span class="brand-mark" aria-hidden="true">FL</span> FocusLock</div>
      <section class="card" aria-labelledby="mode-title">
        <div class="status-pill"><span class="status-dot" aria-hidden="true"></span><span id="mode-pill">Fresh session</span></div>
        <h1 id="mode-title">Start a fresh Safe Search session</h1>
        <p class="intro" id="mode-subtitle">
          Set how long Safe Search stays on.
        </p>
        <label class="field" for="duration-input">Duration</label>
        <input
          id="duration-input"
          type="text"
          class="duration-input"
          placeholder="e.g. 20 mins or 1 hour"
          autocomplete="off"
          aria-describedby="duration-hint duration-error"
        />
        <div class="error duration-error" id="duration-error" role="alert"></div>
        <p class="hint" id="duration-hint">
          Use minutes or hours. Turns off automatically.
        </p>
        <div class="duration-actions">
          <button id="apply-btn">Start Safe Search</button>
          <button id="cancel-btn" class="secondary-button">Cancel</button>
        </div>
      </section>
    </main>
    <script src="whitelist-utils.js"></script>
    <script src="secure-storage.js"></script>
    <script src="safe-search-duration.js"></script>
  </body>
</html>
